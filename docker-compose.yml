services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guardx
      POSTGRES_USER: guardx
      POSTGRES_PASSWORD: guardx_dev_password
    volumes:
      - guardx_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardx -d guardx"]
      interval: 5s
      timeout: 5s
      retries: 10
  guardx:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://guardx:guardx_dev_password@db:5432/guardx
      JWT_SECRET: change-this-docker-development-secret
      GUARDX_SEED: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      SEMANTIC_JUDGE_ENABLED: ${SEMANTIC_JUDGE_ENABLED:-false}
      SEMANTIC_JUDGE_FAIL_MODE: ${SEMANTIC_JUDGE_FAIL_MODE:-HUMAN_REVIEW}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-30}
      PII_NER_MODEL: ${PII_NER_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  guardx_pg:
